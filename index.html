    <!DOCTYPE html>
    <html lang="ko">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>임요섭 — xub2</title>
      <meta property="og:title" content="임요섭 — xub2" />
      <meta property="og:description" content="xub2 Portfolio" />
      <meta property="og:image" content="https://xub2.github.io/assets/images/thumbnail.png" />
      <meta property="og:url" content="https://xub2.github.io" />
      <meta property="og:type" content="website" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:image" content="https://xub2.github.io/assets/images/thumbnail.png" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
      <style>
        :root {
          --bg:          #ffffff;
          --surface:     #f7f8fb;
          --surface2:    #eef1f7;
          --border:      #dde2ed;
          --navy:        #1b3a6b;
          --navy-mid:    #2a5298;
          --navy-light:  #3d6bbf;
          --navy-pale:   #e8eef8;
          --navy-xpale:  #f2f5fc;
          --text:        #111827;
          --text-muted:  #556080;
          --text-dim:    #a0aec0;
          --hero-bg:     #f8faff;
          --nav-bg:      rgba(255,255,255,0.92);
        }

        [data-theme="dark"] {
          --bg:          #0f1117;
          --surface:     #181c27;
          --surface2:    #1f2436;
          --border:      #2a3148;
          --navy:        #5b8de8;
          --navy-mid:    #7aaaf0;
          --navy-light:  #94baf7;
          --navy-pale:   #1a2540;
          --navy-xpale:  #141c32;
          --text:        #e2e8f4;
          --text-muted:  #94a3b8;
          --text-dim:    #4a5568;
          --hero-bg:     #0d1117;
          --nav-bg:      rgba(15,17,23,0.92);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
          background: var(--bg);
          color: var(--text);
          font-family: 'Noto Sans KR', sans-serif;
          font-weight: 400;
          line-height: 1.7;
          overflow-x: hidden;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          text-rendering: optimizeLegibility;
        }

        /* ── NAV ── */
        nav {
          position: fixed;
          top: 0; left: 0; right: 0;
          z-index: 100;
          padding: 0 48px;
          height: 60px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: var(--nav-bg);
          backdrop-filter: blur(12px);
          border-bottom: 1px solid var(--border);
        }

        .nav-logo {
          font-family: 'JetBrains Mono', monospace;
          font-size: 13px;
          color: var(--navy);
          font-weight: 700;
          letter-spacing: 0.05em;
        }

        .nav-dot {
          display: inline-block;
          width: 6px; height: 6px;
          border-radius: 50%;
          background: var(--navy-light);
          margin-left: 4px;
          vertical-align: middle;
          animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.7); }
        }

        .nav-links { display: flex; gap: 32px; }
        .nav-links a {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: var(--text-muted);
          text-decoration: none;
          letter-spacing: 0.1em;
          transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--navy); }

        .theme-toggle {
          position: fixed;
          bottom: 32px;
          right: 32px;
          z-index: 200;
          width: 48px;
          height: 48px;
          border-radius: 50%;
          border: 1.5px solid var(--border);
          background: var(--surface);
          color: var(--text);
          cursor: pointer;
          font-size: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 16px rgba(0,0,0,0.12);
          transition: all 0.2s;
        }
        .theme-toggle:hover {
          transform: scale(1.1);
          box-shadow: 0 6px 24px rgba(0,0,0,0.18);
          border-color: var(--navy);
        }

        /* ── HERO ── */
        .hero {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 100px 48px 80px;
          position: relative;
          overflow: hidden;
          background: var(--hero-bg);
        }

        .hero-blob {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          z-index: 0;
          animation: blobFloat 8s ease-in-out infinite;
        }
        .hero-blob-1 {
          width: 520px; height: 520px;
          top: -100px; left: -80px;
          background: radial-gradient(circle, rgba(61,107,191,0.18) 0%, transparent 70%);
          animation-delay: 0s;
        }
        .hero-blob-2 {
          width: 420px; height: 420px;
          bottom: -80px; right: -60px;
          background: radial-gradient(circle, rgba(27,58,107,0.13) 0%, transparent 70%);
          animation-delay: -3s;
        }
        .hero-blob-3 {
          width: 300px; height: 300px;
          top: 40%; left: 55%;
          background: radial-gradient(circle, rgba(100,140,220,0.10) 0%, transparent 70%);
          animation-delay: -5s;
        }
        @keyframes blobFloat {
          0%, 100% { transform: translate(0, 0) scale(1); }
          33%       { transform: translate(20px, -30px) scale(1.04); }
          66%       { transform: translate(-15px, 20px) scale(0.97); }
        }

        /* 레거시 hero-deco — 숨김 */
        .hero-deco { display: none; }

        .hero-content {
          position: relative;
          z-index: 1;
          max-width: 1100px;
          width: 100%;
          display: grid;
          grid-template-columns: 3fr 2fr;
          gap: 64px;
          align-items: stretch;
        }

        /* ── 왼쪽 컬럼 ── */
        .hero-left {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }

        /* 데스크탑에서 투명 래퍼 — hero-left의 flex 아이템으로 직접 참여 */
        .hero-title-group,
        .hero-body {
          display: contents;
        }

        .hero-tag {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: var(--navy-mid);
          letter-spacing: 0.25em;
          margin-bottom: 20px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .hero-tag::before {
          content: '';
          width: 32px; height: 2px;
          background: var(--navy);
        }

        .hero-name {
          font-family: 'Bebas Neue', sans-serif;
          font-size: clamp(64px, 8vw, 110px);
          line-height: 0.9;
          letter-spacing: 0.02em;
          color: var(--navy);
          margin-bottom: 6px;
        }

        .hero-subtitle {
          font-family: 'Bebas Neue', sans-serif;
          font-size: clamp(22px, 3vw, 40px);
          color: var(--text-dim);
          letter-spacing: 0.12em;
          margin-bottom: 0;
        }

        .hero-divider {
          width: 100%;
          height: 1px;
          background: var(--border);
          margin: 28px 0;
        }

        .hero-desc {
          font-size: 15px;
          color: var(--text-muted);
          line-height: 1.9;
          border-left: 3px solid var(--navy);
          padding-left: 18px;
          word-break: keep-all;
          text-align: left;
          margin-bottom: 32px;
        }

        /* 수치 강조 — 볼드 + 네이비 색상으로 주변 텍스트와 명확히 구분 */
        .hero-desc strong,
        .project-detail-content strong,
        .challenge-headline strong {
          color: var(--navy);
          font-weight: 700;
        }

        .hero-links {
          display: flex;
          gap: 20px;
          flex-wrap: wrap;
          justify-content: flex-start;
        }

        /* ── 오른쪽 컬럼 ── */
        .hero-right-col {
          position: relative;
          display: flex;
          align-items: flex-start;
          justify-content: center;
          padding-top: 270px;
        }


        .hero-photo {
          position: relative;
          z-index: 1;
          width: 230px;
          height: 295px;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 16px 48px rgba(27,58,107,0.20);
          margin: 0px 24px 24px;
        }
        .hero-photo img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center top;
          display: block;
        }

        .hero-btn-group {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        }

        .hero-btn-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.25em;
          color: var(--navy-mid);
        }

        .btn {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 12px 24px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          letter-spacing: 0.1em;
          text-decoration: none;
          border-radius: 3px;
          transition: all 0.2s;
          cursor: pointer;
          border: none;
        }

        .btn-primary {
          background: var(--navy);
          color: #fff;
          font-weight: 700;
          border: 2px solid transparent;
        }
        .btn-primary:hover {
          background: var(--navy-mid);
          transform: translateY(-2px);
          box-shadow: 0 8px 24px rgba(27,58,107,0.25);
        }

        .btn-secondary {
          background: transparent;
          color: var(--navy);
          border: 2px solid var(--navy);
          font-weight: 700;
        }
        .btn-secondary:hover {
          background: var(--navy-pale);
          transform: translateY(-2px);
        }

        /* ── DOWNLOAD BUTTONS ── */
        .btn-download {
          padding: 18px 40px;
          font-size: 15px;
          width: 280px;
          justify-content: center;
          letter-spacing: 0.08em;
          border-radius: 6px;
          position: relative;
          overflow: hidden;
        }
        .btn-download::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.12) 50%, transparent 60%);
          transform: translateX(-100%);
          transition: transform 0.5s ease;
        }
        .btn-download:hover::before {
          transform: translateX(100%);
        }
        .btn-download.btn-primary {
          background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
          box-shadow: 0 4px 16px rgba(27,58,107,0.30);
        }
        .btn-download.btn-primary:hover {
          background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-light) 100%);
          transform: translateY(-3px);
          box-shadow: 0 10px 28px rgba(27,58,107,0.40);
        }
        .btn-download.btn-secondary {
          border-width: 2px;
          box-shadow: 0 2px 10px rgba(27,58,107,0.12);
        }
        .btn-download.btn-secondary:hover {
          transform: translateY(-3px);
          box-shadow: 0 10px 28px rgba(27,58,107,0.20);
          background: var(--navy-pale);
        }

        .btn-ghost {
          background: transparent;
          color: var(--text-muted);
          border: 1.5px solid var(--border);
        }
        .btn-ghost:hover {
          border-color: var(--navy-light);
          color: var(--navy);
        }

        .btn-disabled {
          opacity: 0.35;
          pointer-events: none;
          cursor: not-allowed;
          filter: grayscale(0.4);
        }

        /* ── SECTION COMMON ── */
        .section-wrap {
          padding: 96px 48px;
          max-width: 1200px;
          margin: 0 auto;
        }

        .section-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          color: var(--navy-mid);
          letter-spacing: 0.3em;
          text-transform: uppercase;
          margin-bottom: 12px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .section-label::before {
          content: '';
          width: 20px; height: 2px;
          background: var(--navy);
        }

        .section-title {
          font-family: 'Bebas Neue', sans-serif;
          font-size: clamp(36px, 5.5vw, 64px);
          line-height: 1;
          margin-bottom: 56px;
          color: var(--navy);
          letter-spacing: 0.03em;
        }

        .full-divider {
          width: 100%;
          height: 1px;
          background: var(--border);
        }

        /* ── SKILLS ── */
        .skills-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
        }

        @media (max-width: 1024px) {
          .skills-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
          .skills-grid { grid-template-columns: 1fr; }
        }

        .skill-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 6px;
          padding: 28px;
          transition: all 0.2s;
          position: relative;
          overflow: hidden;
        }
        .skill-card::before {
          content: '';
          position: absolute;
          top: 0; left: 0;
          width: 3px; height: 100%;
          background: var(--navy);
          opacity: 0;
          transition: opacity 0.2s;
        }
        .skill-card:hover {
          box-shadow: 0 4px 20px rgba(27,58,107,0.08);
          transform: translateY(-2px);
        }

        .skill-card-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 9px;
          color: var(--navy-mid);
          letter-spacing: 0.25em;
          margin-bottom: 8px;
        }

        .skill-card-title {
          font-size: 14px;
          font-weight: 700;
          margin-bottom: 14px;
          color: var(--navy);
        }

        .skill-tags {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
        }

        .tag {
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          padding: 6px 12px;
          border: 1px solid var(--border);
          color: var(--text-muted);
          border-radius: 4px;
          background: var(--bg);
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .tag img {
          width: 17px;
          height: 17px;
          object-fit: contain;
          opacity: 0.9;
        }
        .tag.highlight img {
          opacity: 1;
        }

        .tag.highlight {
          border-color: rgba(27,58,107,0.35);
          color: var(--navy);
          background: var(--navy-pale);
          font-weight: 500;
        }

        .section-desc {
          font-size: 15px;
          color: var(--text-muted);
          margin-top: -36px;
          margin-bottom: 40px;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .section-desc::before {
          content: '※';
          font-size: 12px;
          color: var(--navy-mid);
        }

        /* ── PROJECTS ── */
        .project-card {
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 8px;
          margin-bottom: 20px;
          overflow: hidden;
          transition: border-color 0.3s, box-shadow 0.3s;
        }
        .project-card:hover {
          border-color: var(--navy-light);
          box-shadow: 0 8px 32px rgba(27,58,107,0.1);
        }

        .project-header {
          padding: 40px 40px 32px;
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 24px;
          align-items: start;
        }

        .project-number {
          font-family: 'Bebas Neue', sans-serif;
          font-size: 72px;
          line-height: 1;
          margin-bottom: 4px;
          color: var(--navy);
        }

        .project-title {
          font-family: 'Bebas Neue', sans-serif;
          font-size: clamp(24px, 3.5vw, 42px);
          line-height: 1.1;
          margin-bottom: 14px;
          color: var(--navy);
        }

        .project-meta {
          display: flex;
          gap: 20px;
          flex-wrap: wrap;
          margin-bottom: 16px;
        }

        .project-meta-item {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: var(--text-muted);
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .project-meta-item::before {
          content: '';
          width: 4px; height: 4px;
          border-radius: 50%;
          background: var(--navy-light);
        }

        .project-desc {
          font-size: 14px;
          color: var(--text-muted);
          line-height: 1.8;
          max-width: 600px;
        }

        .project-detail {
          margin-top: 20px;
        }
        .project-detail-row {
          display: grid;
          grid-template-columns: 80px 1fr;
          gap: 16px;
          padding: 12px 0;
          border-top: 1px solid var(--border);
          align-items: start;
        }
        .project-detail-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          color: var(--navy-mid);
          letter-spacing: 0.2em;
          padding-top: 3px;
        }
        .project-detail-content {
          font-size: 14.5px;
          color: var(--text-muted);
          line-height: 1.75;
          word-break: keep-all;
        }
        .project-detail-content ul {
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 5px;
        }
        .project-detail-content ul li::before {
          content: '—';
          margin-right: 8px;
          color: var(--navy-light);
        }
        .project-stack-tags {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
        }
        .project-stack-tag {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px;
          background: var(--navy-xpale);
          color: var(--navy-mid);
          border: 1px solid var(--navy-pale);
          padding: 3px 10px;
          border-radius: 3px;
          letter-spacing: 0.05em;
          display: inline-flex;
          align-items: center;
          gap: 5px;
        }
        .project-stack-tag img {
          width: 13px;
          height: 13px;
          object-fit: contain;
          opacity: 0.85;
        }

        .project-badge {
          background: #fff;
          color: var(--navy);
          border: 1.5px solid var(--navy);
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          font-weight: 700;
          padding: 7px 16px;
          border-radius: 3px;
          white-space: nowrap;
          letter-spacing: 0.1em;
        }

        .project-challenges {
          padding: 0 40px 36px;
          border-top: 1px solid var(--border);
          background: var(--surface);
        }

        .challenge-title {
          font-family: 'JetBrains Mono', monospace;
          font-size: 13px;
          color: var(--navy-mid);
          letter-spacing: 0.25em;
          padding: 20px 0 16px;
          border-bottom: 1px solid var(--border);
          margin-bottom: 4px;
        }

        .challenge-item {
          display: grid;
          grid-template-columns: 28px 1fr;
          gap: 16px;
          padding: 20px 0;
          border-bottom: 1px solid var(--border);
          align-items: start;
        }
        .challenge-item:last-child { border-bottom: none; }

        .challenge-idx {
          font-family: 'JetBrains Mono', monospace;
          font-size: 18px;
          color: var(--navy-light);
          font-weight: 700;
          line-height: 1.2;
        }

        .challenge-headline {
          font-size: 17px;
          font-weight: 700;
          color: var(--navy);
          margin-bottom: 6px;
          line-height: 1.5;
        }

        .challenge-body {
          font-size: 14.5px;
          color: var(--text-muted);
          line-height: 1.8;
        }

        .cb-row {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
      line-height: 1.7;
    }
    .cb-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy-mid);
      letter-spacing: 0.05em;
      white-space: nowrap;
      padding-top: 2px;
      width: 38px;
      flex-shrink: 0;
    }
    .challenge-result {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-top: 10px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 14px;
          font-weight: 700;
          color: var(--navy);
          background: var(--navy-pale);
          border: 1px solid rgba(27,58,107,0.2);
          padding: 5px 12px;
          border-radius: 3px;
        }
        .challenge-result::before {
          content: '결과 ▶';
          font-size: 14px;
          font-weight: 700;
          margin-right: 2px;
        }

        .challenge-arch {
          margin-top: 16px;
        }
        .challenge-arch-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: var(--text-muted);
          letter-spacing: 0.15em;
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 8px;
          font-weight: 700;
        }
        .challenge-arch-label::before {
          content: '';
          width: 16px;
          height: 1px;
          background: var(--text-muted);
        }
        .challenge-arch-imgs {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
        }
        .challenge-arch img {
          height: 80px;
          width: auto;
          max-width: 160px;
          object-fit: cover;
          border-radius: 5px;
          border: 1px solid var(--border);
          cursor: zoom-in;
          transition: opacity 0.2s, border-color 0.2s;
          display: block;
        }
        .challenge-arch img:hover {
          opacity: 0.85;
          border-color: var(--navy-light);
        }

        /* ── LIGHTBOX ── */
        .lightbox {
          display: none;
          position: fixed;
          inset: 0;
          z-index: 9999;
          background: rgba(0,0,0,0.85);
          align-items: center;
          justify-content: center;
          cursor: zoom-out;
        }
        .lightbox.active { display: flex; }
